name: CI/CD Pipeline

on:
  push:
    branches: ["dev", "staging", "master"]
  pull_request:
    branches: ["dev", "staging", "master"]

jobs:
  # 1. Tests & Qualité (s'exécute sur toutes les branches et PR autorisées)
  test-and-quality:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check & Lint
        run: |
          npx tsc --noEmit
          bun run lint

      - name: Run Unit Tests with Coverage
        run: bun run test:unit:coverage

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=valros76
            -Dsonar.projectKey=valros76_webdevoo-lead

  # 2. Tests E2E Playwright
  e2e-tests:
    needs: test-and-quality
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.62.1-jammy

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: webdevoo_lead
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies (unzip)
        run: |
          apt-get update && apt-get install -y unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lockb', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Database Migrations
        run: bun run db:push
        env:
          DB_HOST: mysql
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_NAME: webdevoo_lead

      - name: Run Playwright E2E Tests
        run: npx playwright test
        env:
          DB_HOST: mysql
          DB_PORT: "3306"
          DB_USER: root
          DB_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DB_NAME: webdevoo_lead

  # 3. Promotion automatique vers Staging (uniquement sur push dev)
  auto-promote-to-staging:
    needs: [test-and-quality, e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create and Enable Auto-Merge to Staging
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_URL=$(gh pr list --base staging --head dev --state open --json url --jq '.[0].url')

          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base staging \
              --head dev \
              --title "chore(ci): promotion automatique de dev vers staging" \
              --body "Promotion automatique déclenchée après validation des tests sur dev.")
          fi

          gh pr merge "$PR_URL" --auto --merge

  # 4. Validation sur Staging (uniquement sur push staging)
  staging-validation:
    needs: [test-and-quality, e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: Staging Gate Check
        run: |
          echo "hello ! Validation pour aller vers master."

  # 5. Création de la PR de Staging vers Master (uniquement sur push staging)
  auto-pr-master:
    needs: [staging-validation]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create PR to Master (Manual Merge)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          PR_URL=$(gh pr list --base master --head staging --state open --json url --jq '.[0].url')

          if [ -z "$PR_URL" ]; then
            gh pr create \
              --base master \
              --head staging \
              --title "release(ci): préparation de la mise en production (staging -> master)" \
              --body "Validation sur staging réussie. En attente de validation humaine pour le merge vers master."
          fi

  # 6. Build et Release sur Master (uniquement sur push master, protégé par les tests)
  production-release:
    needs: [test-and-quality, e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Production Gate Check
        run: |
          echo "hello mise en prod"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Nuxt Application
        run: bun run build

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-production-build
          path: .output/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Semantic Release
        run: npx -p semantic-release -p @semantic-release/commit-analyzer -p @semantic-release/release-notes-generator -p @semantic-release/changelog -p @semantic-release/git -p @semantic-release/github semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}