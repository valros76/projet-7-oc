name: CI/CD Pipeline

on:
  push:
    branches: ["dev", "staging", "master"]
  pull_request:
    branches: ["dev", "staging", "master"]

jobs:
  # 1. Tests unitaires, type-check & lint
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check & Lint
        run: npx tsc --noEmit

      - name: Run Unit Tests
        run: bun run test:unit

  # 2. Tests E2E Playwright
  e2e-tests:
    needs: test-and-lint
    runs-on: ubuntu-latest

    # Ajout du service MySQL pour que 'localhost:3306' soit accessible
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Browsers & System Dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright E2E Tests
        run: npx playwright test

  # 3. Promotion automatique de dev vers staging si les tests passent
  push-to-staging:
    needs: [test-and-lint, e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to staging branch
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: staging
          force: true

  # 4. Promotion automatique de staging vers master si les tests passent sur staging
  push-to-master:
    needs: [test-and-lint, e2e-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to master branch
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: master
          force: true

  # 5. Build et Release (exécuté sur master après la synchronisation)
  build-and-release:
    needs: [push-to-master]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
          cache: true

      - name: Install dependencies
        run: bun install

      - name: Build Nuxt Application
        run: bun run build

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuxt-production-build
          path: .output/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Semantic Release
        run: npx -p semantic-release -p @semantic-release/commit-analyzer -p @semantic-release/release-notes-generator -p @semantic-release/changelog -p @semantic-release/git -p @semantic-release/github semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
