services:
  # Service de Base de Données MySQL
  db:
    image: mysql:8.0
    container_name: webdevoo_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: webdevoo_lead
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Service de l'Application Nuxt 4
  app:
    build: .
    container_name: webdevoo_app
    restart: always
    command: sh -c "node -e 'const net = require(\"net\"); const client = new net.Socket(); const tryConnect = () => client.connect(3306, \"db\", () => { client.end(); process.exit(0); }); client.on(\"error\", () => { setTimeout(tryConnect, 1000); }); tryConnect();' && bunx drizzle-kit push && bun run dev"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=webdevoo_lead
      - DB_PORT=3306
      - JWT_ACCESS_SECRET=votre_cle_secrete_access_locale
      - JWT_REFRESH_SECRET=votre_cle_secrete_refresh_locale
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: